<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- 16-48 px variant (taskbar, title bar): no batons, the lock fills the dial. -->
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/><stop offset="0.5" stop-color="#b3bac4"/><stop offset="1" stop-color="#7a828d"/>
    </linearGradient>
    <radialGradient id="dial" cx="0.4" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#4d9dff"/><stop offset="0.65" stop-color="#1f66d9"/><stop offset="1" stop-color="#13409a"/>
    </radialGradient>
    <linearGradient id="shackle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd5dd"/><stop offset="0.45" stop-color="#ffffff"/><stop offset="1" stop-color="#b4bcc6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe5ec"/>
